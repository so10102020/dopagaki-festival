<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070012"><title>ドパガキ・ハンター</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+JP:wght@700;900&display=swap');
:root{--p:#ff147e;--c:#20f5ff;--y:#ffe600;--bg:#070012}*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:'Noto Sans JP',sans-serif;overflow:hidden;touch-action:manipulation}.game{height:100svh;max-width:540px;margin:auto;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 48%,#4b0866,#13002c 45%,#05000c 80%)}.rays{position:absolute;inset:-55%;background:repeating-conic-gradient(transparent 0 13deg,rgba(32,245,255,.12) 14deg 16deg);animation:spin 14s linear infinite}.noise{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.5px);background-size:39px 39px;opacity:.4;animation:stars 6s linear infinite}.hud{position:absolute;z-index:10;top:max(13px,env(safe-area-inset-top));left:15px;right:15px;display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:7px;text-align:center}.panel{border:2px solid var(--c);background:#110029cc;box-shadow:0 0 12px #00eaff;padding:7px 3px;font:900 11px 'Noto Sans JP';letter-spacing:.4px}.panel b{display:block;font:22px 'Black Han Sans';color:var(--y);line-height:1;text-shadow:1px 2px #f10058}.board{position:absolute;inset:0;z-index:2}.intro,.finish{z-index:20;position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:linear-gradient(#080018b8,#180034b8);backdrop-filter:blur(3px)}.finish{display:none}.box{width:min(93%,440px);border:4px solid var(--y);padding:24px 14px;background:linear-gradient(135deg,#500074,#d20066 47%,#120046);box-shadow:0 0 16px var(--y),0 0 65px var(--p);transform:skew(-2deg)}h1{font:clamp(47px,13vw,72px)/.78 'Black Han Sans';margin:0;color:var(--y);text-shadow:5px 5px #f1005d,-3px -3px var(--c)}h1 span{display:block;font-size:.38em;letter-spacing:5px;color:#fff;margin:15px 0}.how{font-size:14px;line-height:1.7;margin:20px auto}.how strong{color:var(--c);font-size:17px}.start,.again{border:0;border-radius:40px;background:linear-gradient(#fff 0 8%,#ff197c 9% 54%,#81003f 55%);color:#fff;font:900 20px 'Noto Sans JP';padding:15px 28px;box-shadow:0 6px #490023,0 0 22px var(--p);cursor:pointer}.start:active,.again:active{transform:translateY(5px)}.target{position:absolute;width:clamp(78px,24vw,110px);aspect-ratio:1;border-radius:50%;border:5px solid #fff;background:radial-gradient(circle at 32% 23%,#fff 0 7%,var(--c) 8% 14%,#006aff 16% 32%,#97007e 59%,#25003c);box-shadow:0 0 0 5px var(--p),0 0 20px 10px var(--c),0 0 43px 17px var(--p);display:grid;place-items:center;font:24px 'Black Han Sans';color:var(--y);text-shadow:2px 2px #d30040;animation:pulse .25s infinite alternate;z-index:5}.target::after{content:'TAP!';position:absolute;bottom:-25px;color:white;font:12px 'Black Han Sans';letter-spacing:1px;text-shadow:0 0 8px var(--p)}.burst{position:absolute;z-index:8;pointer-events:none;font:48px 'Black Han Sans';color:var(--y);text-shadow:3px 3px var(--p),-2px -2px var(--c);animation:burst .42s forwards}.bad{animation:shake .3s}.flash{position:absolute;inset:0;background:#fff;pointer-events:none;z-index:15;opacity:0}.flash.on{animation:flash .2s}.rank{font:clamp(46px,14vw,72px)/.82 'Black Han Sans';color:var(--y);text-shadow:5px 5px var(--p),-3px -3px var(--c);margin:8px}.scoreline{font-size:22px;margin:18px}.best{font-size:12px;color:var(--c)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes stars{to{transform:translate(39px,39px)}}@keyframes pulse{to{transform:scale(1.11);filter:brightness(1.4)}}@keyframes burst{to{transform:translateY(-55px) scale(1.5) rotate(-8deg);opacity:0}}@keyframes flash{50%{opacity:.9}}@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
</style></head>
<body><main class="game" id="game"><div class="rays"></div><div class="noise"></div><div class="hud"><div class="panel">TIME<b id="time">20.0</b></div><div class="panel">ドパガキ<b id="score">0</b></div><div class="panel">LIFE<b id="life">♥♥♥</b></div></div><div class="board" id="board"></div><div class="flash" id="flash"></div><section class="intro" id="intro"><div class="box"><h1>ドパガキ<span>HUNTER</span></h1><p class="how"><strong>光るドパガキだけを、20秒で撃ち抜け！</strong><br>空振りするとライフが削れる。<br>連続命中でスコアが爆増するぞ。</p><button class="start" id="start">狩りを始める！</button></div></section><section class="finish" id="finish"><div class="box"><div id="rank" class="rank">激アツ！</div><div class="scoreline">最終スコア <b id="final">0</b></div><div class="best">BEST: <span id="best">0</span></div><button class="again" id="again">もう一回ドパる！</button></div></section></main>
<script>
const board=document.querySelector('#board'), intro=document.querySelector('#intro'),finish=document.querySelector('#finish'),timeEl=document.querySelector('#time'),scoreEl=document.querySelector('#score'),lifeEl=document.querySelector('#life'),flash=document.querySelector('#flash');let score=0,life=3,combo=0,active=false,target,timer,last,ctx;
document.querySelector('#best').textContent=localStorage.dopagakiBest||0;
function beep(f,d=.06){try{ctx??=new AudioContext();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.08,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}
function showTarget(){if(!active)return;target?.remove();target=document.createElement('button');target.className='target';target.textContent=combo>=5?'神':'ドパ';const size=Math.min(110,78+combo*2),x=8+Math.random()*(100-(size/4.2)),y=17+Math.random()*65;target.style.left=`calc(${x}% - ${size/2}px)`;target.style.top=`${y}%`;target.onclick=e=>{e.stopPropagation();hit(target)};board.append(target);clearTimeout(timer);timer=setTimeout(()=>miss(),Math.max(350,900-combo*35))}
function hit(el){if(!active)return;combo++;score+=10+combo*4;scoreEl.textContent=score;beep(420+combo*55);flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');const b=document.createElement('div');b.className='burst';b.textContent=combo>4?'激アツ!!':'+ドパ!';b.style.left=el.style.left;b.style.top=el.style.top;board.append(b);setTimeout(()=>b.remove(),430);showTarget()}
function miss(){if(!active)return;combo=0;life--;lifeEl.textContent='♥'.repeat(life)+'♡'.repeat(3-life);beep(120,.16);board.classList.remove('bad');void board.offsetWidth;board.classList.add('bad');target?.remove();life?setTimeout(showTarget,220):end()}
board.onclick=()=>{if(active)miss()};
function start(){score=0;life=3;combo=0;active=true;scoreEl.textContent=0;lifeEl.textContent='♥♥♥';intro.style.display='none';finish.style.display='none';last=performance.now();requestAnimationFrame(tick);showTarget()}
function tick(now){if(!active)return;const left=Math.max(0,20-(now-last)/1000);timeEl.textContent=left.toFixed(1);if(left<=0){end();return}requestAnimationFrame(tick)}
function end(){active=false;clearTimeout(timer);target?.remove();target=null;const best=Math.max(score,Number(localStorage.dopagakiBest||0));localStorage.dopagakiBest=best;document.querySelector('#best').textContent=best;document.querySelector('#final').textContent=score;document.querySelector('#rank').textContent=score>=380?'銀河級・神ドパ！':score>=220?'超・激アツ！':score>=90?'ドパガキ成功！':'修行が足りん！';finish.style.display='grid';beep(score>=220?950:280,.25)}
document.querySelector('#start').onclick=start;document.querySelector('#again').onclick=start;
</script></body></html>
