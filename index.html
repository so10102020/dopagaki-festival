<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#080018" />
  <title>ドパガキ祭 | DOPAGAKI FESTIVAL</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+JP:wght@700;900&display=swap');
    :root{--pink:#ff147d;--cyan:#24f6ff;--gold:#ffe600;--ink:#080018}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:white;font-family:'Noto Sans JP',sans-serif;overflow:hidden;touch-action:manipulation}.game{height:100svh;max-width:540px;margin:auto;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 40%,#5b076d 0,#170040 36%,#060010 72%)}.rays,.stars,.scan{inset:-40%;position:absolute;pointer-events:none}.rays{background:repeating-conic-gradient(from 0deg,transparent 0 12deg,rgba(36,246,255,.12) 13deg 16deg);animation:spin 12s linear infinite}.stars{background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(var(--gold) 1px,transparent 1px);background-size:37px 37px,61px 61px;animation:drift 8s linear infinite;opacity:.7}.scan{background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.04) 4px);z-index:4}.top{position:absolute;z-index:5;top:max(12px,env(safe-area-inset-top));left:18px;right:18px;display:flex;justify-content:space-between;align-items:center}.logo{font-family:'Black Han Sans',sans-serif;font-size:25px;line-height:.8;transform:skew(-8deg);text-shadow:3px 3px #ff147d,-2px -2px #24f6ff}.logo small{display:block;font:700 8px sans-serif;letter-spacing:3px;color:var(--gold);margin:8px 0 0 3px}.coin{background:#1a0640;border:2px solid var(--gold);border-radius:50px;padding:7px 11px;color:var(--gold);box-shadow:0 0 14px #ffdd00}.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:2}.sub{font-size:12px;letter-spacing:4px;color:var(--cyan);text-shadow:0 0 10px var(--cyan);margin-bottom:2px}.title{font-family:'Black Han Sans',sans-serif;text-align:center;font-size:clamp(57px,16vw,88px);line-height:.78;letter-spacing:-3px;transform:skew(-5deg);background:linear-gradient(#fff 0 20%,var(--gold) 21% 50%,#ff6c00 51% 70%,#ff147d 71%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(5px 5px 0 #580080) drop-shadow(-3px -3px 0 var(--cyan));animation:throb .55s infinite alternate}.title span{display:block;font-size:.53em;letter-spacing:5px;margin-top:13px}.machine{width:min(86vw,410px);aspect-ratio:1;margin:25px 0 16px;position:relative;border:7px solid var(--gold);border-radius:50%;background:radial-gradient(circle,#ffed72 0 11%,#f91f68 12% 16%,#2b006d 17% 53%,#09001d 54%);box-shadow:0 0 0 6px #ff147d,0 0 26px 10px #ff147d,0 0 56px 15px #24f6ff;display:grid;place-items:center}.machine:before,.machine:after{content:'★';position:absolute;color:#fff;filter:drop-shadow(0 0 5px var(--cyan));font-size:33px;animation:spin 2s linear infinite}.machine:before{top:10%;left:14%}.machine:after{bottom:8%;right:13%}.orb{width:43%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 25%,white 0 5%,var(--cyan) 7%,#0086ff 30%,#36007d 68%);box-shadow:inset -12px -15px 28px #110035,0 0 27px 9px var(--cyan);display:grid;place-items:center;font-family:'Black Han Sans';font-size:42px;color:var(--gold);text-shadow:3px 3px #f00;animation:float 1.3s ease-in-out infinite}.hint{font-size:12px;color:#ffe600;letter-spacing:2px;text-shadow:0 0 8px #ff147d}.tap{border:0;border-radius:100px;padding:17px 31px;background:linear-gradient(180deg,#fff 0 9%,var(--pink) 10% 48%,#91004d 49%);color:#fff;font:900 20px 'Noto Sans JP';letter-spacing:2px;box-shadow:0 7px 0 #4b0030,0 0 20px #ff147d,0 0 30px #24f6ff;transform:skew(-6deg);cursor:pointer}.tap:active{transform:translateY(6px) skew(-6deg);box-shadow:0 1px 0 #4b0030}.bottom{position:absolute;z-index:5;bottom:max(15px,env(safe-area-inset-bottom));left:18px;right:18px;display:flex;justify-content:space-between;font-size:10px;color:#bdb0ff}.result{position:absolute;z-index:20;inset:0;display:none;place-items:center;text-align:center;background:rgba(4,0,20,.72);backdrop-filter:blur(4px)}.result.show{display:grid}.card{width:88%;padding:26px 15px 24px;border:4px solid var(--gold);background:linear-gradient(135deg,#ff147d,#4b006c 45%,#031d70);box-shadow:0 0 20px var(--gold),0 0 70px var(--pink);transform:rotate(-2deg);animation:pop .35s cubic-bezier(.15,1.5,.4,1)}.jackpot{font-family:'Black Han Sans';font-size:clamp(45px,14vw,72px);line-height:.85;color:var(--gold);text-shadow:4px 4px #ef005c,-3px -3px var(--cyan)}.prize{font-size:23px;margin:18px 0}.share{border:2px solid white;background:#080018;color:#fff;border-radius:30px;padding:12px 19px;font-weight:900;margin-top:8px}.flash{animation:flash .18s 8}@keyframes spin{to{transform:rotate(360deg)}}@keyframes drift{to{transform:translate(37px,61px)}}@keyframes throb{to{filter:drop-shadow(8px 8px 0 #580080) drop-shadow(-4px -4px 0 var(--cyan)) brightness(1.35)}}@keyframes float{50%{transform:translateY(-9px) rotate(8deg)}}@keyframes pop{from{transform:scale(.15) rotate(15deg)}to{transform:scale(1) rotate(-2deg)}}@keyframes flash{50%{filter:brightness(3) saturate(2)}}
  </style>
</head>
<body><main class="game" id="game"><div class="rays"></div><div class="stars"></div><div class="scan"></div><header class="top"><div class="logo">ドパガキ祭<small>DOPAGAKI FESTIVAL</small></div><div class="coin">⚡ <span id="count">0</span></div></header><section class="stage"><div class="sub">＼ 指一本で、宇宙級の運試し ／</div><h1 class="title">爆裂<br>ドパガキ<span>CHANCE</span></h1><div class="machine"><div class="orb">?</div></div><p class="hint">画面が割れるほど、連打せよ。</p><button class="tap" id="tap">限界突破！</button></section><footer class="bottom"><span>© DOPAGAKI WORKS</span><span>音あり推奨 🔊</span></footer><section class="result" id="result"><div class="card"><div class="jackpot" id="rank">超・大当たり！</div><div class="prize" id="prize">ドパガキ神の祝福 × 1</div><p>眩しすぎて目が覚めるほどの幸運！</p><button class="share" id="again">もう一度、光を浴びる</button></div></section></main><script>
const tap=document.querySelector('#tap'),game=document.querySelector('#game'),result=document.querySelector('#result'),count=document.querySelector('#count'),orb=document.querySelector('.orb');let n=0,ctx;
function sound(f=440,d=.08){try{ctx??=new AudioContext();let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.08,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch(e){}}
tap.onclick=()=>{n++;count.textContent=n;orb.textContent=['!','!!','!!!','神'][Math.min(3,Math.floor(n/3))];sound(240+n*70,.07);game.classList.remove('flash');void game.offsetWidth;game.classList.add('flash');if(n>=7)setTimeout(win,250)};
function win(){let rare=Math.random();let data=rare>.88?['虹色・銀河大当たり！','伝説のドパガキ王冠 × 1']:rare>.52?['超・大当たり！','発光ドパガキ × 777']:['ドパガキ当たり！','金ピカおやつ券 × 3'];document.querySelector('#rank').textContent=data[0];document.querySelector('#prize').textContent=data[1];sound(880,.2);setTimeout(()=>sound(1320,.35),100);result.classList.add('show')}
document.querySelector('#again').onclick=()=>{n=0;count.textContent=0;orb.textContent='?';result.classList.remove('show')};
</script></main></body></html>
