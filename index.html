<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ドパガキ PINBALL ∞</title><style>
@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+JP:wght@800;900&display=swap');:root{--p:#ff087b;--c:#14f8ff;--y:#fff000}*{box-sizing:border-box}body{margin:0;background:#030009;color:#fff;font-family:'Noto Sans JP';overflow:hidden;touch-action:none}.wrap{height:100svh;max-width:540px;margin:auto;position:relative;overflow:hidden;background:#080017}.wrap:before{content:'';position:absolute;inset:-60%;background:repeating-conic-gradient(from 5deg,#ff008011 0 7deg,#00ffff15 8deg 11deg,transparent 12deg 18deg);animation:spin 12s linear infinite}.top{position:absolute;z-index:5;top:max(8px,env(safe-area-inset-top));left:9px;right:9px;display:flex;justify-content:space-between;gap:5px}.logo{font:21px/.8 'Black Han Sans';color:var(--y);text-shadow:3px 3px var(--p),-2px -2px var(--c);transform:skew(-7deg)}.logo small{display:block;font:8px sans-serif;letter-spacing:2px;color:#fff;margin:5px}.stat{min-width:88px;text-align:center;padding:4px 8px;background:#15002cd9;border:2px solid var(--c);box-shadow:0 0 9px var(--c);font-size:9px}.stat b{display:block;font:20px/.9 'Black Han Sans';color:var(--y);text-shadow:1px 2px var(--p)}canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}.controls{position:absolute;z-index:6;bottom:max(16px,env(safe-area-inset-bottom));left:12px;right:12px;display:grid;grid-template-columns:1fr .65fr 1fr;gap:8px}.ctl{border:3px solid #fff;border-radius:50px;color:#fff;height:64px;background:linear-gradient(#ff4ca5,#a60056 60%,#420029);box-shadow:0 5px #3a0024,0 0 15px var(--p),inset 0 3px #fff9;font:900 18px 'Noto Sans JP';text-shadow:2px 2px #4b0035}.ctl:nth-child(2){background:linear-gradient(#fff77c,#ff9d00 55%,#d20051);color:#520033;box-shadow:0 5px #71002b,0 0 18px var(--y);font-size:14px}.ctl:active{transform:translateY(5px);box-shadow:0 0 13px var(--c)}.overlay{position:absolute;z-index:10;inset:0;display:grid;place-items:center;background:#050013c9;backdrop-filter:blur(3px);text-align:center;padding:20px}.card{width:min(91%,410px);padding:25px 13px;border:4px solid var(--y);background:linear-gradient(135deg,#4d0078,#e00068 48%,#031861);box-shadow:0 0 20px var(--y),0 0 70px var(--p);transform:skew(-2deg)}h1{font:clamp(43px,12vw,68px)/.78 'Black Han Sans';margin:0;color:var(--y);text-shadow:5px 5px var(--p),-3px -3px var(--c)}h1 span{display:block;font-size:.42em;letter-spacing:5px;color:#fff;margin-top:13px}.card p{font-size:13px;line-height:1.8}.start{border:0;border-radius:50px;padding:14px 26px;color:#fff;background:linear-gradient(#fff,#ff238c 13%,#97004d 70%);box-shadow:0 6px #4a0029,0 0 22px var(--p);font:900 19px 'Noto Sans JP'}.hide{display:none}@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body><main class="wrap" id="wrap"><header class="top"><div class="logo">ドパガキ<small>PINBALL ∞</small></div><div class="stat">SCORE<b id="score">000000</b></div><div class="stat">CHAIN<b id="chain">×1</b></div></header><canvas id="c"></canvas><div class="controls"><button class="ctl" id="left">◀ 左フリップ</button><button class="ctl" id="launch">発 射<br>⚡</button><button class="ctl" id="right">右フリップ ▶</button></div><section class="overlay" id="overlay"><div class="card"><h1>ドパガキ<span>PINBALL ∞</span></h1><p>バンパーを撃ち抜いて<strong>連鎖倍率</strong>を上げろ。<br>左右フリップで玉を救え！<br>※開始するとド派手BGMが鳴ります。</p><button class="start" id="start">ドパれ！</button></div></section></main><script>
const canvas=document.querySelector('#c'),x=canvas.getContext('2d'),wrap=document.querySelector('#wrap');let W,H,S,ball,bumps=[],score=0,chain=1,lastHit=0,running=false,raf,audio,beat,particles=[];
function resize(){S=devicePixelRatio;W=wrap.clientWidth;H=wrap.clientHeight;canvas.width=W*S;canvas.height=H*S;x.setTransform(S,0,0,S,0,0);if(!ball)resetBall()}addEventListener('resize',resize);resize();
function resetBall(){ball={x:W*.85,y:H*.74,vx:0,vy:0,r:10,ready:true};bumps=[{x:W*.27,y:H*.29,r:29,n:'777'},{x:W*.68,y:H*.25,r:29,n:'激'},{x:W*.49,y:H*.43,r:35,n:'ドパ'},{x:W*.23,y:H*.55,r:27,n:'熱'},{x:W*.76,y:H*.55,r:27,n:'神'}]}
function tone(f,d=.08,type='square',vol=.06){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}
function music(){clearInterval(beat);let i=0,notes=[110,0,165,220,0,165,294,220];beat=setInterval(()=>{if(!running)return;let n=notes[i++%notes.length];if(n)tone(n,.13,'sawtooth',.025)},145)}
function launch(){if(!running||!ball.ready)return;ball.ready=false;ball.vx=-2.4;ball.vy=-15;tone(110,.24,'sawtooth',.1);flash('#fff000')}
function flip(side){if(!running||ball.ready)return;let near=ball.y>H*.70&&(side==='l'?ball.x<W*.54:ball.x>W*.46);tone(210,.05,'square',.05);if(near){ball.vy=-Math.max(10,Math.abs(ball.vy)*.78);ball.vx+=(side==='l'?4:-4);spark(ball.x,ball.y,'#14f8ff',12);tone(620,.12,'sawtooth',.09)}}
function hit(b){let dx=ball.x-b.x,dy=ball.y-b.y,d=Math.hypot(dx,dy)||1;if(d<ball.r+b.r){let nx=dx/d,ny=dy/d;ball.x=b.x+nx*(ball.r+b.r+1);let dot=ball.vx*nx+ball.vy*ny;ball.vx-=2*dot*nx;ball.vy-=2*dot*ny;ball.vx+=nx*2;ball.vy+=ny*2;let now=performance.now();chain=now-lastHit<1800?Math.min(chain+1,99):1;lastHit=now;score+=100*chain;document.querySelector('#score').textContent=String(score).padStart(6,'0');document.querySelector('#chain').textContent='×'+chain;tone(350+chain*22,.10,'square',.08);tone(700+chain*14,.18,'sawtooth',.04);spark(b.x,b.y,chain>5?'#fff000':'#ff147e',18+Math.min(chain,20));if(chain>=5)flash('#ff147e');}}
function spark(px,py,col,n){for(let i=0;i<n;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*12,vy:(Math.random()-.5)*12,col,life:1})}function flash(col){wrap.animate([{filter:'brightness(1)'},{filter:`brightness(2.8) drop-shadow(0 0 30px ${col})`},{filter:'brightness(1)'}],{duration:230})}
function update(){if(!running)return;if(!ball.ready){ball.vy+=.32;ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.997;if(ball.x-ball.r<15){ball.x=15+ball.r;ball.vx=Math.abs(ball.vx)*.88;tone(130,.03)}if(ball.x+ball.r>W-15){ball.x=W-15-ball.r;ball.vx=-Math.abs(ball.vx)*.88;tone(130,.03)}if(ball.y-ball.r<72){ball.y=72+ball.r;ball.vy=Math.abs(ball.vy)*.88}bumps.forEach(hit);if(ball.y>H+25){score=Math.max(0,score-500);document.querySelector('#score').textContent=String(score).padStart(6,'0');resetBall();chain=1;document.querySelector('#chain').textContent='×1';tone(70,.3,'sawtooth',.1)}}particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life-=.035});particles=particles.filter(p=>p.life>0)}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#100030';x.fillRect(12,65,W-24,H-87);x.strokeStyle='#14f8ff';x.lineWidth=5;x.shadowBlur=17;x.shadowColor='#14f8ff';x.strokeRect(14,67,W-28,H-90);x.shadowBlur=0;for(let i=0;i<30;i++){x.fillStyle='rgba(255,255,255,.23)';x.fillRect((i*61)%W,80+(i*97)%(H-180),1,1)}bumps.forEach(b=>{let g=x.createRadialGradient(b.x-7,b.y-9,2,b.x,b.y,b.r);g.addColorStop(0,'#fff');g.addColorStop(.16,'#fff000');g.addColorStop(.45,'#ff087b');g.addColorStop(1,'#4d007a');x.fillStyle=g;x.shadowBlur=22;x.shadowColor='#ff087b';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#fff';x.textAlign='center';x.font='900 16px Black Han Sans';x.fillText(b.n,b.x,b.y+6)});x.strokeStyle='#ff087b';x.lineWidth=13;x.lineCap='round';x.beginPath();x.moveTo(W*.14,H*.82);x.lineTo(W*.46,H*.88);x.moveTo(W*.86,H*.82);x.lineTo(W*.54,H*.88);x.stroke();particles.forEach(p=>{x.globalAlpha=p.life;x.fillStyle=p.col;x.fillRect(p.x,p.y,4,4)});x.globalAlpha=1;let g=x.createRadialGradient(ball.x-3,ball.y-4,1,ball.x,ball.y,ball.r);g.addColorStop(0,'#fff');g.addColorStop(.25,'#14f8ff');g.addColorStop(1,'#9b00ff');x.fillStyle=g;x.shadowBlur=21;x.shadowColor='#fff';x.beginPath();x.arc(ball.x,ball.y,ball.r,0,7);x.fill();x.shadowBlur=0;if(chain>1){x.font='900 24px Black Han Sans';x.fillStyle='#fff000';x.textAlign='center';x.fillText(chain+' 連 鎖 !!',W/2,102)}}
function loop(){update();draw();raf=requestAnimationFrame(loop)}
function start(){audio=new(window.AudioContext||window.webkitAudioContext)();running=true;document.querySelector('#overlay').classList.add('hide');music();cancelAnimationFrame(raf);loop()}
document.querySelector('#start').onclick=start;document.querySelector('#launch').onclick=launch;[['left','l'],['right','r']].forEach(([id,s])=>{let e=document.querySelector('#'+id);e.onpointerdown=q=>{q.preventDefault();flip(s)}});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')flip('l');if(e.key==='ArrowRight')flip('r');if(e.code==='Space')launch()});
</script></main></body></html>
