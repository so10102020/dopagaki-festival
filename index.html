<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ドパガキ 4秒チャレンジ</title><style>
@import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+JP:wght@700;900&display=swap');:root{--p:#ff087b;--c:#16f7ff;--y:#fff000;--bg:#070012}*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:'Noto Sans JP';overflow:hidden;touch-action:none}.game{height:100svh;max-width:540px;margin:auto;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 48%,#470060,#120024 52%,#04000b)}.game:before,.game:after{content:'';pointer-events:none;position:absolute;inset:-60%;z-index:0}.game:before{background:repeating-conic-gradient(transparent 0 11deg,#ff00801d 12deg 14deg,#00ffff1a 15deg 17deg);animation:spin 11s linear infinite}.game:after{background-image:radial-gradient(#fff 1px,transparent 1.5px);background-size:38px 38px;opacity:.42;animation:drift 6s linear infinite}.top{z-index:5;position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:6px;text-align:center}.stat{background:#120027de;border:2px solid var(--c);box-shadow:0 0 11px var(--c);padding:5px 3px;font-size:9px}.stat b{display:block;color:var(--y);font:22px/.9 'Black Han Sans';text-shadow:2px 2px var(--p)}.arena{position:absolute;z-index:2;inset:72px 0 0;display:flex;align-items:center;justify-content:center;padding:12px}.mission{text-align:center;width:100%}.label{font-size:12px;letter-spacing:4px;color:var(--c);text-shadow:0 0 9px var(--c)}.order{font:clamp(36px,10vw,57px)/1 'Black Han Sans';color:var(--y);text-shadow:4px 4px var(--p),-3px -3px var(--c);margin:10px 0 22px}.meter{height:15px;border:2px solid #fff;background:#260043;width:90%;margin:auto;box-shadow:0 0 12px var(--p)}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--y),var(--p));width:100%;transform-origin:left;box-shadow:0 0 10px var(--y)}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:27px auto 0;max-width:400px}.choice,.waitBtn{height:103px;border:3px solid #fff;background:#210046;color:#fff;box-shadow:0 0 15px var(--p),inset 0 0 20px #00eeff25;font:28px 'Black Han Sans';cursor:pointer}.choice:active,.waitBtn:active{transform:scale(.93)}.circle{border-radius:50%;background:radial-gradient(circle,#ff74b6,#d00074 60%,#51002e)}.square{background:linear-gradient(135deg,#17f7ff,#0354df 55%,#29004e)}.triangle{clip-path:polygon(50% 4%,96% 94%,4% 94%);border:0;background:linear-gradient(135deg,#fff700,#ff7300 55%,#fa007f);filter:drop-shadow(0 0 10px #ff007b)}.moveTrack{height:78px;max-width:430px;margin:35px auto;background:#180032;border:3px solid #fff;position:relative;box-shadow:0 0 15px var(--c)}.goal{position:absolute;right:4%;top:7px;width:22%;height:58px;background:#fff000;box-shadow:0 0 20px var(--y);color:#6d0047;font:13px 'Black Han Sans';display:grid;place-items:center}.knob{position:absolute;left:5%;top:9px;width:60px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#16f7ff 15%,#006aff 60%,#560080);box-shadow:0 0 17px var(--c);display:grid;place-items:center;font:12px 'Black Han Sans'}.waitBtn{width:min(80vw,330px);border-radius:50%;background:radial-gradient(circle,#950088,#3a005b 57%,#100020);box-shadow:0 0 23px var(--p);font-size:26px}.waitBtn.go{background:radial-gradient(circle,#fff,#fff000 21%,#ff0080 65%);color:#60002b;box-shadow:0 0 33px var(--y),0 0 70px var(--p);animation:boom .16s infinite alternate}.fx{z-index:7;pointer-events:none;position:absolute;inset:0;display:grid;place-items:center}.comboFx{font:clamp(38px,13vw,75px) 'Black Han Sans';color:var(--y);text-shadow:5px 5px var(--p),-4px -4px var(--c);opacity:0}.comboFx.show{animation:pop .65s}.intro,.end{position:absolute;z-index:20;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:#070013c9;backdrop-filter:blur(4px)}.end{display:none}.card{width:min(92%,420px);padding:26px 13px;border:4px solid var(--y);background:linear-gradient(135deg,#520079,#e00068 48%,#06196b);box-shadow:0 0 20px var(--y),0 0 70px var(--p)}h1{font:clamp(46px,13vw,70px)/.77 'Black Han Sans';margin:0;color:var(--y);text-shadow:5px 5px var(--p),-3px -3px var(--c)}h1 span{display:block;font-size:.4em;letter-spacing:5px;color:#fff;margin-top:14px}.card p{font-size:13px;line-height:1.8}.start{border:0;border-radius:45px;padding:15px 28px;background:linear-gradient(#fff,#ff1d89 16%,#92004c 70%);color:#fff;box-shadow:0 6px #450025,0 0 24px var(--p);font:900 19px 'Noto Sans JP'}.shake{animation:shake .3s}@keyframes spin{to{transform:rotate(360deg)}}@keyframes drift{to{transform:translate(38px,38px)}}@keyframes boom{to{transform:scale(1.12);filter:brightness(1.5)}}@keyframes pop{0%{opacity:0;transform:scale(.2) rotate(-15deg)}25%{opacity:1}100%{opacity:0;transform:scale(1.55) rotate(8deg)}}@keyframes shake{25%{transform:translateX(-14px)}75%{transform:translateX(14px)}}
</style></head><body><main class="game" id="game"><header class="top"><div class="stat">LIFE<b id="life">♥♥♥</b></div><div class="stat">COMBO<b id="combo">0</b></div><div class="stat">SCORE<b id="score">0000</b></div></header><section class="arena" id="arena"></section><div class="fx"><div id="comboFx" class="comboFx"></div></div><section id="intro" class="intro"><div class="card"><h1>ドパガキ<span>4秒チャレンジ</span></h1><p>4秒以内に、出た指示を処理しろ。<br>成功を重ねるほど<strong>演出・BGM・SEが暴走</strong>する。</p><button id="start" class="start">今すぐドパる！</button></div></section><section id="end" class="end"><div class="card"><h1 id="rank">激アツ！</h1><p>最終スコア <b id="final">0</b><br><small>BEST: <span id="best">0</span></small></p><button id="again" class="start">もう一回ドパる！</button></div></section></main><script>
const arena=document.querySelector('#arena'),lifeEl=document.querySelector('#life'),comboEl=document.querySelector('#combo'),scoreEl=document.querySelector('#score'),game=document.querySelector('#game'),fx=document.querySelector('#comboFx');let life,combo,score,active,deadline,raf,ac,beat,waitTimer;
function snd(f,d=.08,type='square',v=.07){if(!ac)return;let o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}function music(){clearInterval(beat);let i=0,a=[147,0,196,220,0,294,220,196];beat=setInterval(()=>{if(active){let n=a[i++%a.length];if(n)snd(n*(1+combo*.015),.1,'sawtooth',.018+Math.min(combo,16)*.002)}},Math.max(80,160-combo*3))}
function hud(){lifeEl.textContent='♥'.repeat(life)+'♡'.repeat(3-life);comboEl.textContent=combo;scoreEl.textContent=String(score).padStart(4,'0')}function timer(now){if(!active)return;let remain=Math.max(0,deadline-now);let m=document.querySelector('.meter i');if(m)m.style.transform=`scaleX(${remain/4000})`;if(!remain){fail();return}raf=requestAnimationFrame(timer)}function shell(title,html){arena.innerHTML=`<div class="mission"><div class="label">4 SEC MISSION</div><div class="order">${title}</div><div class="meter"><i></i></div>${html}</div>`;deadline=performance.now()+4000;cancelAnimationFrame(raf);raf=requestAnimationFrame(timer)}
function choose(){if(!active)return;clearTimeout(waitTimer);let r=Math.floor(Math.random()*3);if(r===0)shape();else if(r===1)move();else wait()}
function shape(){let opts=['●','■','▲'],ans=Math.floor(Math.random()*3),names=['丸を押せ！','四角を押せ！','三角を押せ！'];shell(names[ans],`<div class="choices">${opts.map((o,i)=>`<button class="choice ${['circle','square','triangle'][i]}" data-i="${i}">${o}</button>`).join('')}</div>`);document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>Number(b.dataset.i)===ans?win():fail())}
function move(){shell('ここまで動かせ！',`<div class="moveTrack" id="track"><div class="goal">ここ！</div><div class="knob" id="knob">動かす</div></div>`);let k=document.querySelector('#knob'),track=document.querySelector('#track'),drag=false;function go(e){if(!drag)return;let p=(e.touches?e.touches[0]:e).clientX-track.getBoundingClientRect().left;p=Math.max(5,Math.min(track.clientWidth-65,p));k.style.left=p+'px';if(p>track.clientWidth*.7){drag=false;win()}}k.onpointerdown=e=>{drag=true;k.setPointerCapture(e.pointerId)};k.onpointermove=go;k.onpointerup=()=>drag=false}
function wait(){shell('消えた瞬間に押せ！',`<button class="waitBtn" id="waitBtn">待て…</button>`);let b=document.querySelector('#waitBtn'),ready=false;b.onclick=()=>ready?win():fail();waitTimer=setTimeout(()=>{ready=true;b.textContent='今だ!!';b.classList.add('go');snd(820,.18,'sawtooth',.1)},700+Math.random()*1700)}
function win(){if(!active)return;deadline=Infinity;cancelAnimationFrame(raf);combo++;score+=100+combo*30;hud();snd(440+combo*25,.11,'square',.09);snd(880+combo*20,.17,'sawtooth',.04);fx.textContent=combo>=10?'神・連・鎖!!':combo+' COMBO!';fx.classList.remove('show');void fx.offsetWidth;fx.classList.add('show');game.animate([{filter:'brightness(1)'},{filter:`brightness(${Math.min(3,1+combo*.09)}) saturate(${1+combo*.13})`},{filter:'brightness(1)'}],{duration:250});music();setTimeout(choose,320)}
function fail(){if(!active)return;deadline=Infinity;cancelAnimationFrame(raf);life--;combo=0;snd(80,.26,'sawtooth',.12);hud();game.classList.remove('shake');void game.offsetWidth;game.classList.add('shake');life?setTimeout(choose,450):end()}
function start(){life=3;combo=0;score=0;active=true;hud();document.querySelector('#intro').style.display='none';document.querySelector('#end').style.display='none';ac=new(window.AudioContext||window.webkitAudioContext)();music();choose()}function end(){active=false;clearInterval(beat);clearTimeout(waitTimer);cancelAnimationFrame(raf);let best=Math.max(score,+localStorage.dopagaki4best||0);localStorage.dopagaki4best=best;document.querySelector('#best').textContent=best;document.querySelector('#final').textContent=score;document.querySelector('#rank').textContent=score>=1800?'神・ドパガキ!!':score>=900?'超・激アツ！':score>=350?'ドパ成功！':'まだいける！';document.querySelector('#end').style.display='grid'}document.querySelector('#start').onclick=start;document.querySelector('#again').onclick=start;
</script></main></body></html>
